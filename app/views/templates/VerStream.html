<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar un Stream - LUSAM Self-Driving</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #101018;
            color: #e1bfff;
            min-height: 100vh;
            background: linear-gradient(rgba(10, 10, 20, 0.92), rgba(10, 10, 20, 0.92)),
                url('/static/car.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .container {
            max-width: 700px;
            margin: 60px auto 0 auto;
            background: rgba(10, 10, 20, 0.85);
            border: 2px solid #7b1fa2;
            box-shadow: 0 0 24px #7b1fa244;
            padding: 2.5rem 2rem 2rem 2rem;
            border-radius: 0;
            text-align: center;
        }

        h1 {
            color: #7b1fa2;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 8px #00eaff88;
        }

        p {
            color: #e1bfff;
            margin-bottom: 2rem;
        }

        .stream-view img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: rotate(180deg);
            display: none;
        }
        .btn-menu {
            background: linear-gradient(90deg, #7b1fa2 60%, #00eaff 100%);
            color: #fff;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 0;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 1.1em;
            box-shadow: 0 0 8px #00eaff55;
            transition: background 0.2s, transform 0.2s;
            margin: 0.5rem;
        }

        .btn-menu:hover {
            background: linear-gradient(90deg, #00eaff 0%, #7b1fa2 100%);
            color: #181828;
            transform: translateY(-2px) scale(1.03);
        }

        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .search-input {
            padding: 1rem;
            border: 2px solid #00eaff;
            background: rgba(10, 10, 20, 0.85);
            color: #e1bfff;
            font-size: 1em;
            width: 60%;
            margin-right: 0.5rem;
            box-shadow: 0 0 8px #00eaff44;
        }

        .search-input:focus {
            outline: none;
            border-color: #7b1fa2;
            box-shadow: 0 0 12px #7b1fa244;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Visualizar un Stream</h1>
        <p>Observa el stream de otros vehículos autónomos en tiempo real.</p>

        <div class="search-container">
            <input type="text" id="streamIdInput" class="search-input" placeholder="Ingresa el ID del stream...">
            <button class="btn-menu" onclick="cargarStream()">Buscar</button>
        </div>

        <!-- Contenedor donde se mostrará el video -->
        <div class="stream-view">
            <img id="videoFeed" src="/stream/{stream_id}" alt="Stream del espectador"
                style="display: none; width: 100%; max-width: 640px; transform: rotate(180deg);" />
        </div>

        <div class="buttons-container">
            <button class="btn-menu" onclick="window.location.href='/menu'">Regresar al Menú</button>
        </div>
    </div>

    <script>async function cargarStream() {
            const streamId = document.getElementById("streamIdInput").value.trim();
            const video = document.getElementById("videoFeed");

            if (!streamId) {
                alert("Por favor, ingresa un ID de stream.");
                return;
            }

            // Verificar si el stream existe y está activo
            try {
                const response = await fetch(`/verificar_stream/${streamId}`);
                const data = await response.json();

                if (data.existe) {
                    // Si el stream existe, asignar la fuente del video
                    alert("si existe");
                    video.src = `/stream/${streamId}`;
                    video.style.display = "block";  // Mostrar el video
                } else {
                    alert("El stream no existe o no está activo.");
                    video.style.display = "none";  // Ocultar el video si no hay stream
                }
            } catch (error) {
                console.error("Error al verificar el stream:", error);
                alert("Ocurrió un error al buscar el stream.");
            }
        }
    </script>
</body>

</html>
