<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUSAM Self-Driving</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #101018;
            color: #e1bfff;
            min-height: 100vh;
            background: linear-gradient(rgba(10, 10, 20, 0.92), rgba(10, 10, 20, 0.92)),
                url('/static/car.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        nav {
            background-color: rgba(30, 0, 40, 0.92);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #7b1fa2;
            box-shadow: 0 2px 12px #7b1fa244;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #7b1fa2;
            border: 2px solid #00eaff;
        }

        .user-profile span {
            font-size: 1.2em;
            font-weight: bold;
            color: #00eaff;
        }

        .back-button {
            background: linear-gradient(90deg, #7b1fa2 60%, #00eaff 100%);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px #00eaff55;
            margin-right: 1rem;
        }

        .back-button:hover {
            background: linear-gradient(90deg, #00eaff 0%, #7b1fa2 100%);
            transform: translateY(-2px);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: #00eaff;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #7b1fa2;
        }

        .main-content {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        .stream-container {
            flex: 1;
            background-color: rgba(10, 10, 20, 0.85);
            padding: 1rem;
            border-radius: 0;
            border: 2px solid #7b1fa2;
            position: relative;
            box-shadow: 0 0 24px #7b1fa244;
        }

        .stream-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .stream-header i {
            color: #00eaff;
        }

        .timer {
            background-color: rgba(10, 10, 20, 0.92);
            padding: 0.5rem 1rem;
            border-radius: 0;
            border: 1.5px solid #00eaff;
            color: #00eaff;
            position: absolute;
            top: 10px;
            left: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #videoStream {
            width: 100%;
            height: 450px;
            background: url('carretera.jpg') no-repeat center center;
            background-size: cover;
            border-radius: 0;
            border: 2px solid #7b1fa2;
            box-shadow: 0 0 16px #00eaff44;
            position: relative;
        }

        .controls-container {
            width: 400px;
            padding: 2rem;
            background-color: rgba(10, 10, 20, 0.85);
            border-radius: 0;
            border: 2px solid #7b1fa2;
            box-shadow: 0 0 24px #7b1fa244;
        }

        .controls-title {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: 2px;
            color: #7b1fa2;
            text-shadow: 0 0 8px #00eaff88;
        }

        .control-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
            justify-items: center;
            align-items: center;
        }

        .control-button {
            width: 60px;
            height: 60px;
            background-color: #181828;
            border: 2px solid #00eaff;
            color: #00eaff;
            border-radius: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px #7b1fa244;
        }

        .control-button:hover {
            background-color: #7b1fa2;
            color: #fff;
            border-color: #7b1fa2;
        }

        .action-buttons {
            display: grid;
            gap: 1rem;
        }

        .action-button {
            background: linear-gradient(90deg, #7b1fa2 60%, #00eaff 100%);
            color: #fff;
            border: none;
            padding: 1rem;
            border-radius: 0;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 0 8px #00eaff55;
        }

        .action-button:hover {
            background: linear-gradient(90deg, #00eaff 0%, #7b1fa2 100%);
            color: #fff;
            transform: translateY(-2px);
        }

        .start-stream {
            background: linear-gradient(90deg, #7b1fa2 60%, #00eaff 100%);
            color: #fff;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 0;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 1rem;
            width: 100%;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px #00eaff55;
        }

        .start-stream:hover {
            background: linear-gradient(90deg, #00eaff 0%, #7b1fa2 100%);
        }

        .alert-message {
            margin: 1rem auto;
            padding: 1rem 2rem;
            border-radius: 0;
            font-weight: bold;
            text-transform: uppercase;
            background: rgba(10, 10, 20, 0.85);
            border: 2px solid;
            box-shadow: 0 0 24px rgba(0, 234, 255, 0.27);
            max-width: 500px;
            text-align: center;
            animation: fadeOut 2s forwards;
            animation-delay: 2s;
        }

        .alert-success {
            border-color: #00eaff;
            color: #00eaff;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="user-profile">
            <span>Bienvenido: {{ usuario.capitalize() }}</span>
        </div>
        <div class="nav-links">
            <a href="/menu">Regresar al menú</a>
            <a href="/instrucciones">Instrucciones</a>
            <a href="/acerca">Acerca de</a>

        </div>

    </nav>

    <div class="main-content">
        <div class="stream-container">
            <button class="start-stream" id="streamButton" onclick="toggleStream()">INICIAR STREAM</button>
            <div style="position: relative;">
                <img id="videoStream" src="" alt="Stream de ESP32-CAM"
                    style="display: none; width: 100%; max-width: 640px; transform: rotate(360deg);" />
                <div class="timer-container">
                    <div class="timer">0:00:0</div>
                </div>
            </div>

            <!-- Nuevos campos añadidos aquí -->
            <div class="info-boxes" style="display: none; gap: 1rem; margin-top: 1rem;" id="infoBoxes">
                <div
                    style="flex: 1; background-color: rgba(10, 10, 20, 0.85); padding: 1rem; border: 2px solid #7b1fa2;">
                    <div style="color: #00eaff; font-weight: bold; margin-bottom: 0.5rem;">DISTANCIA</div>
                    <div id="distancia" style="color: #e1bfff; font-size: 1.2rem;">00 cm</div>
                </div>
                <div
                    style="flex: 1; background-color: rgba(10, 10, 20, 0.85); padding: 1rem; border: 2px solid #7b1fa2;">
                    <div style="color: #00eaff; font-weight: bold; margin-bottom: 0.5rem;">CÓDIGO DE ACCESO</div>
                    <div id="codigo-acceso" style="color: #e1bfff; font-size: 1.2rem;">----</div>
                </div>
            </div>
        </div>

        <div class="controls-container">
            <div id="captureMessage" class="alert-message alert-success" style="display: none;">Captura realizada</div>
            <h2 class="controls-title">CONTROLES</h2>

            <div class="control-buttons">
                <div></div>
                <button class="control-button" onmousedown="startCommand('w')" onmouseup="stopCommand()"
                    ontouchstart="startCommand('w')" ontouchend="stopCommand()">↑</button>
                <div></div>
                <button class="control-button" onmousedown="startCommand('a')" onmouseup="stopCommand()"
                    ontouchstart="startCommand('a')" ontouchend="stopCommand()">←</button>
                <button class="control-button" onmousedown="startCommand('s')" onmouseup="stopCommand()"
                    ontouchstart="startCommand('s')" ontouchend="stopCommand()">↓</button>
                <button class="control-button" onmousedown="startCommand('d')" onmouseup="stopCommand()"
                    ontouchstart="startCommand('d')" ontouchend="stopCommand()">→</button>
            </div>
            <div class="action-buttons">
                <button class="action-button">AUTOMÁTICO</button>
                <button class="action-button">MANUAL</button>
                <button class="action-button" onclick="tomarFoto()">TOMAR FOTO</button>
                <button class="action-button" id="detectionButton" onclick="toggleDetection()">IDENTIFICAR
                    OBSTÁCULO</button>
            </div>
        </div>
    </div>

    <script>
        let streaming = false;
        let detecting = false;
        let timerInterval;
        let seconds = 0;
        let streamId = null;
        let intervaloDistancia;
        let matriculaCarro = "UVCARRITO";

        const timerElement = document.querySelector('.timer');
        timerElement.style.display = 'none';

        const COMMAND_DELAY = 100;
        let currentCommand = null;
        let commandInterval = null;

        document.addEventListener('mouseup', stopCommand);
        document.addEventListener('touchend', stopCommand);

        // Nueva función async
        async function toggleStream() {
            const video = document.getElementById('videoStream');

            if (!streaming) {
                const streamName = prompt("Ingresa el nombre del stream:");
                if (streamName === null || streamName.trim() === "") {
                    return; // El usuario canceló o no ingresó nombre
                }
                try {

                    // 1. Verificar estado actual del carro
                    const checkResponse = await fetch(`/carros/estado/${matriculaCarro}`);
                    const estadoData = await checkResponse.json();

                    if (!checkResponse.ok) {
                        alert("Error al verificar estado del carro: " + estadoData.detail);
                        return;
                    }

                    if (estadoData.enUso === true) {
                        alert("El carro no está disponible actualmente");
                        return;
                    }

                    // 2. Marcar carro como en uso
                    await fetch(`/carros/actualizar-estado`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            matricula: matriculaCarro,
                            enUso: true
                        })
                    });

                    // 3. Continuar con el inicio del stream
                    const response = await fetch("/start_stream", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: new URLSearchParams({
                            titulo: streamName,
                            matricula: matriculaCarro // Agregamos la matrícula al stream
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        alert("Error al iniciar el stream: " + data.detail);
                        return;
                    }

                    streamId = data.stream_id;
                    document.getElementById("codigo-acceso").textContent = streamId;

                    video.src = `/deteccion_feed/${streamId}`;
                    streaming = true;
                    document.getElementById("streamButton").innerText = "DETENER STREAM";
                    video.style.display = "block";
                    infoBoxes.style.display = "flex";
                    timerElement.style.display = 'block';
                    startTimer();
                    enableControlButtons(true);
                } catch (err) {
                    console.error("Error en el proceso:", err);
                    alert("Error: " + err.message);

                    // Intenta revertir el estado del carro si falló algo después de marcarlo como en uso
                    try {
                        await fetch(`/carros/actualizar-estado`, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                matricula: matriculaCarro,
                                enUso: false
                            })
                        });
                    } catch (revertErr) {
                        console.error("Error al revertir estado:", revertErr);
                    }
                }

                // Iniciar a leer la distacia 
                if (!intervaloDistancia) {
                    intervaloDistancia = setInterval(actualizarDistancia, 500);
                }
            } else {
                // Detener stream en backend si tenemos ID
                if (streamId) {
                    try {
                        await fetch(`/stop_stream/${streamId}`, {
                            method: "POST"
                        });
                    } catch (err) {
                        console.error("Error al detener stream:", err);
                    }
                    streamId = null;
                }

                // Desactivar detección de objetos si está activa
                if (detecting) {
                    try {
                        await fetch("/deteccion/toggle", {
                            method: "POST"
                        });
                        detecting = false;
                        document.getElementById("detectionButton").innerText = "IDENTIFICAR OBSTÁCULO";
                    } catch (err) {
                        console.error("Error al desactivar detección:", err);
                    }
                }

                // Marcar carro como en desuso
                await fetch(`/carros/actualizar-estado`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        matricula: matriculaCarro,
                        enUso: false
                    })
                });


                video.src = "";
                streaming = false;
                document.getElementById("streamButton").innerText = "INICIAR STREAM";
                video.style.display = "none";
                infoBoxes.style.display = "none";
                stopTimer();
                timerElement.style.display = 'none';
                enableControlButtons(false);
                stopCommand();

                if (intervaloDistancia) {
                    clearInterval(intervaloDistancia);
                    intervaloDistancia = null;  // Importante: resetear la variable
                }
            }
        }

        function toggleDetection() {
            detecting = !detecting;
            const button = document.getElementById("detectionButton");
            button.innerText = detecting ? "DETENER DETECCIÓN" : "IDENTIFICAR OBSTÁCULO";

            fetch("/deteccion/toggle", {
                method: "POST"
            });
        }

        function tomarFoto() {

            const datos = {
                stream_id: streamId
            };

            console.log("stream_id enviado:", window.stream_id);
            fetch('/deteccion/capturar_foto', {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
                .then(response => response.json())
                .then(data => {
                    console.log('Foto guardada:', data);
                    // Mostrar mensaje de éxito
                    const captureMessage = document.getElementById('captureMessage');
                    captureMessage.style.display = 'block';
                    // Ocultar mensaje después de 2 segundos
                    setTimeout(() => {
                        captureMessage.style.display = 'none';
                    }, 2000);
                })
                .catch(error => {
                    console.error('Error al tomar la foto:', error);
                });
        }
        function startTimer() {
            seconds = 0;
            updateTimerDisplay();
            timerInterval = setInterval(updateTimerDisplay, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            seconds = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            timerElement.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            seconds++;
        }

        function enableControlButtons(enable) {
            const buttons = document.querySelectorAll('.control-button');
            buttons.forEach(button => {
                button.disabled = !enable;
            });
        }

        function startCommand(command) {
            if (!streaming) return;

            stopCommand();
            sendCommand(command);
            currentCommand = command;
            commandInterval = setInterval(() => {
                sendCommand(command);
            }, COMMAND_DELAY);
        }

        function stopCommand() {
            if (commandInterval) {
                clearInterval(commandInterval);
                commandInterval = null;
            }
            if (currentCommand) {
                currentCommand = null;
            }
        }

        async function sendCommand(direction) {
            try {
                const response = await fetch(`/manejo/command/${direction}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    }
                });

                if (!response.ok) {
                    throw new Error('Error en la respuesta del servidor');
                }

                const data = await response.json();
                console.log('Comando enviado:', data.command);
            } catch (error) {
                console.error('Error al enviar comando:', error);
            }
        }

        async function actualizarDistancia() {
            try {
                const res = await fetch("/distancia_actual");
                const data = await res.json();
                document.getElementById("distancia").innerText = data.distancia;
            } catch (e) {
                console.error("Error al obtener la distancia:", e);
            }
        }
    </script>

</body>

</html>
