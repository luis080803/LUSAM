<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Cuenta - LUSAM Self-Driving</title>
        <!-- importamos el css -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/configuracion.css') }}">
    <script>
        function checkConfirm() {
            const pass = document.getElementById("password").value;
            const confirm = document.getElementById("confirmar_password").value;
            const warning = document.getElementById("confirm-warning");

            if (pass !== confirm) {
                warning.style.display = "block";
                return false;
            }
            warning.style.display = "none";
            return true;
        }

        // Función para formatear la fecha
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toISOString().split('T')[0];
        }

        // Cuando el documento esté listo
        document.addEventListener('DOMContentLoaded', function () {
            // Formatear la fecha de nacimiento
            const fechaNacimiento = document.querySelector('input[name="FechaNacimiento"]');
            if (fechaNacimiento && fechaNacimiento.value) {
                fechaNacimiento.value = formatDate(fechaNacimiento.value);
            }
        });
    </script>
</head>

<body>
    <div class="container">
        <h1>Configuración de Cuenta</h1>
        <p>Edita tu información personal o cambia tu contraseña.</p>

        <form method="POST" action="/actualizar_perfil" id="perfilForm" onsubmit="return checkConfirm()">

            <div class="user-row">
                <span class="user-label">Nombre:</span>
                <input type="text" name="Nombre" value="{{ usuario_datos.Nombre if usuario_datos else usuario.Nombre }}"
                    required>
            </div>

            <div class="user-row">
                <span class="user-label">Apellido Paterno:</span>
                <input type="text" name="ApellidoPaterno"
                    value="{{ usuario_datos.ApellidoPaterno if usuario_datos else usuario.ApellidoPaterno }}" required>
            </div>

            <div class="user-row">
                <span class="user-label">Apellido Materno:</span>
                <input type="text" name="ApellidoMaterno"
                    value="{{ usuario_datos.ApellidoMaterno if usuario_datos else usuario.ApellidoMaterno }}">
            </div>

            <div class="user-row">
                <span class="user-label">Correo:</span>
                <input type="text" name="Correo" value="{{ usuario_datos.Correo if usuario_datos else usuario.Correo }}"
                    required>
            </div>

            <div class="user-row">
                <span class="user-label">Fecha Nacimiento:</span>
                <input type="date" name="FechaNacimiento"
                    value="{{ usuario_datos.FechaNacimiento if usuario_datos and usuario_datos.FechaNacimiento else (usuario.FechaNacimiento if usuario.FechaNacimiento else '') }}"
                    required>
            </div>

            <div class="user-row">
                <span class="user-label">Usuario:</span>
                <input type="text" name="Usuario"
                    value="{{ usuario_datos.Usuario if usuario_datos else usuario.Usuario }}" required>
                {% if usuario_existente %}
                <div style="color:#ff5252; font-size:0.85em; margin-top:4px;">
                    El nombre de usuario ya existe. Elige otro.
                </div>
                {% endif %}
            </div>

            <div class="pass-fields">
                <div>
                    <label for="password">Nueva contraseña</label>
                    <input type="password" id="password" name="password" minlength="8">
                </div>
                <div>
                    <label for="confirmar_password">Confirmar nueva contraseña</label>
                    <input type="password" id="confirmar_password" name="confirmar_password" minlength="8">
                    <div id="confirm-warning" class="warning">Las contraseñas no coinciden.</div>
                </div>
            </div>

            <div class="btns">
                <button class="save-btn" type="submit">Guardar Cambios</button>
            </div>
        </form>

        <div class="btns">
            <button class="btn-menu" onclick="window.location.href='/menu';return false;">Regresar al Menú</button>
        </div>
    </div>
</body>

</html>
