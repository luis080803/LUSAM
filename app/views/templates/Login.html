<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>LUSAM SELF-DRIVING - Login</title>
    <!-- importamos el css -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
</head>

<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="left-panel">
            <h1>LUSAM<br>SELF-DRIVING</h1>
            <div class="devs">
                Desarrollado por:<br>
                García Velandia Samuel Obed<br>
                Bravo Ibañez Luis Fernando<br><br>
                Colaboradores:<br>
                Contreras Matla Luis Fernando<br>
                Quintero Ortiz Miguel Isaac<br>
            </div>
        </div>
        <div class="right-panel">
            <form class="login-box" action="/login" method="POST">
                <h2>INICIAR SESION</h2>
                <label for="usuario">USUARIO</label>
                <input type="text" id="username" name="nombre_usuario" required>
                <label for="contrasena">CONTRASEÑA</label>
                <input type="password" id="password" name="contrasena" required>
                <div id="login-warning" style="color:#ff5252; font-size:0.85em; margin-bottom:8px; display:none; text-align:left; width:100%">
                    Usuario o contraseña incorrectos.
                </div>
                <input type="submit" value="LOG IN">
                <div class="login-links">
                    <a href="/registro">¿No tienes cuenta? ¡Regístrate!</a>
                    <a href="/recuperacion">¿Olvidaste tu contraseña?</a>
                </div>
            </form>

        </div>
    </div>
    <script>
        // Verificar si hay un parámetro de error en la URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'invalid_credentials') {
            document.getElementById('login-warning').style.display = 'block';
        }
    </script>
</body>

</html>
